name: Telegram bot tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/telegram-sales-bot-foundation]

jobs:
  telegram-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Telegram bot tests
        run: python -m unittest -v test_telegram_bot.py
