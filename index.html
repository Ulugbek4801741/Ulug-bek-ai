<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ulug‘bek AI</title><style>*{box-sizing:border-box}body{margin:0;background:#212121;color:#ececec;font:16px system-ui}.app{height:100dvh;display:flex}aside{width:240px;background:#171717;padding:20px}main{flex:1;min-width:0;display:flex;flex-direction:column}header{padding:20px;font-size:20px}#chat{flex:1;overflow:auto;padding:20px}#chat p{max-width:740px;margin:0 auto 24px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.user{background:#303030;border-radius:20px;padding:12px}.error{color:#fca5a5}form{margin:10px auto;width:calc(100% - 24px);max-width:760px;padding:12px;background:#303030;border-radius:24px}textarea{width:100%;resize:none;background:transparent;border:0;color:white;font:inherit;padding:10px}button{font:inherit;border:0;border-radius:12px;padding:10px;cursor:pointer}button:disabled{opacity:.5}small{display:block;text-align:center;color:#aaa;padding:10px;font-size:12px}.welcome{text-align:center;margin-top:16vh}#status{padding:0 20px;color:#fcd34d;font-size:13px}@media(max-width:700px){aside{display:none}}</style></head><body><div class="app"><aside><h2>Ulug‘bek AI</h2><button id="new">＋ Yangi suhbat</button><small>ChatGPT rasmiy ilovasi emas.</small></aside><main><header>Ulug‘bek AI <button id="reset" aria-label="Yangi suhbat">＋</button></header><section id="chat" aria-live="polite"><h1 class="welcome">Sizga qanday yordam beray?</h1></section><p id="status" role="status"></p><form id="form"><textarea id="text" maxlength="8000" rows="2" placeholder="Ulug‘bek AI’dan so‘rang" aria-label="Xabar" required></textarea><button id="send">Yuborish ↑</button></form><small>Suhbat shu sahifada vaqtincha ko‘rinadi. AI xato qilishi mumkin.</small></main></div><script>const el=id=>document.getElementById(id);let busy=false;function add(role,text){const p=document.createElement('p');p.className=role;p.textContent=text;el('chat').append(p);el('chat').scrollTop=el('chat').scrollHeight;}function reset(){if(busy)return;el('chat').replaceChildren();el('status').textContent='';}el('new').onclick=reset;el('reset').onclick=reset;el('form').onsubmit=async e=>{e.preventDefault();const text=el('text').value.trim();if(!text||busy)return;busy=true;el('send').disabled=true;el('chat').querySelector('.welcome')?.remove();add('user',text);el('text').value='';el('status').textContent='Javob kutilmoqda…';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),75000);try{const r=await fetch('/api/chat',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text}),signal:controller.signal});if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('AI backend ishlamayapti yoki bu manzilga ulanmagan. GitHub Pages faqat sayt fayllarini ko‘rsatadi.');const d=await r.json();if(!r.ok||d.error)throw Error(d.error||'Server xatosi: '+r.status);if(typeof d.reply!=='string'||!d.reply.trim())throw Error('Server bo‘sh javob qaytardi.');add('assistant',d.reply);el('status').textContent='';}catch(err){add('error',err.name==='AbortError'?'Kutish muddati tugadi.':err.message);el('status').textContent='So‘rov bajarilmadi.';}finally{clearTimeout(timer);busy=false;el('send').disabled=false;}};</script></body></html>
