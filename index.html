<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ulug'bek AI — Professional AI Agent</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { background:#030712; color:#f8fafc; font-family:Inter,system-ui,sans-serif; }
.glass { background:rgba(15,23,42,.72); backdrop-filter:blur(24px); border:1px solid rgba(148,163,184,.14); }
.glow { background:radial-gradient(circle at 20% 20%, rgba(99,102,241,.25), transparent 45%), radial-gradient(circle at 80% 10%, rgba(16,185,129,.18), transparent 40%), radial-gradient(circle at 50% 90%, rgba(168,85,247,.20), transparent 45%); }
.avatar { width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 180deg,#6366f1,#10b981,#a855f7,#6366f1);animation:rotate 8s linear infinite; }
.avatar-inner { width:126px;height:126px;border-radius:50%;background:#020617;display:flex;align-items:center;justify-content:center; }
@keyframes rotate { to { transform:rotate(360deg); } }
.speaking .avatar-inner { animation:talk .35s infinite alternate; border:3px solid #10b981; }
@keyframes talk { from { transform:scale(1); } to { transform:scale(1.07); } }
.listening { box-shadow:0 0 0 6px rgba(245,158,11,.25); }
.scroll::-webkit-scrollbar { width:6px; }
.scroll::-webkit-scrollbar-thumb { background:#10b981; border-radius:10px; }
</style>
</head>
<body class="min-h-screen glow p-4 pb-24">

<div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
<div class="glass max-w-md w-full rounded-[2rem] p-8 text-center shadow-2xl">
<div class="mx-auto mb-5 w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-emerald-500 flex items-center justify-center">
<i class="fa-solid fa-bolt text-2xl"></i>
</div>
<h1 class="text-4xl font-black tracking-tight bg-gradient-to-r from-emerald-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">Ulug'bek AI</h1>
<p class="text-slate-400 mt-3">Professional ovozli AI agent va No-Code mahsulot studiyasi</p>
<div id="googleButton" class="mt-7 flex justify-center"></div>
</div>
</div>

<header class="glass max-w-7xl mx-auto rounded-[2rem] p-5 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-emerald-500 flex items-center justify-center">
<i class="fa-solid fa-bolt"></i>
</div>
<div>
<h1 class="text-2xl font-black bg-gradient-to-r from-emerald-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">Ulug'bek AI</h1>
<p class="text-xs text-slate-400">Professional AI Agent Platform</p>
</div>
</div>
<div id="profile" class="hidden flex items-center gap-3">
<img id="userPhoto" class="w-11 h-11 rounded-full border border-indigo-500" alt="">
<div>
<p id="userName" class="text-sm font-bold"></p>
<p id="userEmail" class="text-[11px] text-slate-400"></p>
</div>
<button onclick="logout()" class="ml-2 text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl">Chiqish</button>
</div>
</header>

<main class="max-w-7xl mx-auto grid lg:grid-cols-5 gap-6">

<section class="glass rounded-[2rem] p-6 lg:col-span-3">
<div class="flex items-center justify-between mb-5">
<h2 class="text-lg font-black"><i class="fa-solid fa-robot text-emerald-400 mr-2"></i>Ovozli AI Agent</h2>
<span id="providerBadge" class="text-[11px] bg-emerald-500/15 text-emerald-300 px-3 py-1 rounded-full font-bold">AUTO FAILOVER</span>
</div>

<div class="flex flex-col items-center">
<div id="avatar" class="avatar">
<div class="avatar-inner"><i class="fa-solid fa-brain text-5xl text-emerald-400"></i></div>
</div>
<p id="avatarStatus" class="mt-4 text-sm font-bold text-slate-300">Tayyor</p>
</div>

<div id="chat" class="h-80 overflow-y-auto mt-6 p-4 bg-slate-950/80 rounded-2xl border border-slate-800 text-sm space-y-4 scroll"></div>

<div class="flex gap-3 mt-5">
<input id="message" placeholder="Savol yozing yoki mikrofonni bosing..." class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-5 py-4 text-sm">
<button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 px-5 rounded-2xl"><i class="fa-solid fa-paper-plane"></i></button>
<button onclick="toggleListening()" class="bg-emerald-600 hover:bg-emerald-500 px-5 rounded-2xl"><i class="fa-solid fa-microphone"></i></button>
</div>
</section>

<section class="glass rounded-[2rem] p-6 lg:col-span-2">
<h2 class="text-lg font-black mb-5"><i class="fa-solid fa-wand-magic-sparkles text-indigo-400 mr-2"></i>No-Code Mahsulot Studiyasi</h2>
<textarea id="appPrompt" rows="8" placeholder="Masalan: Valyuta kursi, ob-havo va yangiliklarni ko‘rsatuvchi professional mobil ilova yoz..." class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl p-4 text-sm"></textarea>
<button onclick="generateApp()" class="w-full mt-5 bg-gradient-to-r from-indigo-600 via-purple-600 to-emerald-600 py-4 rounded-2xl font-black shadow-xl">🚀 Professional ilovani yaratish</button>
<div id="buildStatus" class="hidden mt-4 text-sm text-emerald-400 font-bold"></div>
<div id="codeArea" class="hidden mt-5">
<textarea id="generatedCode" rows="9" class="w-full bg-black text-emerald-400 text-xs p-4 rounded-2xl border border-slate-800"></textarea>
<a id="downloadLink" class="block text-center mt-4 bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-black" download="Ulugbek_AI_App.html">📲 HTML ilovani yuklab olish</a>
</div>
</section>

</main>

<script>
let googleClientId = "";
let listening = false;
let recognition;

async function loadConfig() {
const response = await fetch("/api/config");
const data = await response.json();
googleClientId = data.googleClientId;

if(!googleClientId) {
document.getElementById("googleButton").innerHTML = "<p class='text-red-400 text-sm'>GOOGLE_CLIENT_ID sozlanmagan.</p>";
return;
}

google.accounts.id.initialize({
client_id: googleClientId,
callback: handleGoogleResponse
});

google.accounts.id.renderButton(document.getElementById("googleButton"), {
theme: "filled_black",
size: "large",
shape: "pill",
text: "signin_with",
locale: "uz"
});
}

async function handleGoogleResponse(response) {
const result = await fetch("/api/login", {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({credential: response.credential})
});

const data = await result.json();

if(data.error) {
alert(data.error);
return;
}

document.getElementById("loginScreen").classList.add("hidden");
document.getElementById("profile").classList.remove("hidden");
document.getElementById("userPhoto").src = data.user.picture;
document.getElementById("userName").innerText = data.user.name;
document.getElementById("userEmail").innerText = data.user.email;

addMessage("Ulug'bek AI", `Xush kelibsiz, ${data.user.name}. Men sizning professional AI agentingizman.`);
speak(`Xush kelibsiz, ${data.user.name}`);
}

async function logout() {
await fetch("/api/logout", {method:"POST"});
location.reload();
}

function addMessage(sender, text, chatId) {
const chat = document.getElementById("chat");
const div = document.createElement("div");
div.className = sender === "Siz" ? "bg-slate-900 p-4 rounded-2xl text-right" : "bg-indigo-950/50 border border-indigo-500/25 p-4 rounded-2xl";
div.innerHTML = `<b>${sender}:</b><br>${text}`;

if(chatId) {
const actions = document.createElement("div");
actions.className = "flex gap-2 mt-3";
actions.innerHTML = `
<button onclick="rate(${chatId}, 'good')" class="text-xs bg-emerald-600/20 text-emerald-300 px-3 py-1.5 rounded-xl">👍 Foydali</button>
<button onclick="rate(${chatId}, 'bad')" class="text-xs bg-red-600/20 text-red-300 px-3 py-1.5 rounded-xl">👎 Yaxshilash kerak</button>
`;
div.appendChild(actions);
}

chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
}

async function rate(chatId, rating) {
await fetch("/api/rate", {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({chat_id: chatId, rating})
});
addMessage("Ulug'bek AI", "Fikringiz saqlandi. Keyingi javoblarimni shunga qarab yaxshilayman.");
}

async function sendMessage(text) {
const input = document.getElementById("message");
const message = text || input.value.trim();
if(!message) return;

addMessage("Siz", message);
input.value = "";
setStatus("Tahlil qilmoqda...");

try {
const response = await fetch("/api/chat", {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({prompt: message})
});
const data = await response.json();

if(data.error) throw new Error(data.error);

if(data.provider) {
document.getElementById("providerBadge").innerText = "AI: " + data.provider;
}

addMessage("Ulug'bek AI", data.reply, data.chat_id);
speak(data.reply);
} catch(error) {
addMessage("Xatolik", error.message);
speak("Kechirasiz, xatolik yuz berdi.");
}

setStatus("Tayyor");
}

function speak(text) {
const avatar = document.getElementById("avatar");
avatar.classList.add("speaking");
setStatus("Gapiryapti...");

const speech = new SpeechSynthesisUtterance(text);
speech.lang = "uz-UZ";
speech.rate = 1;
speech.pitch = 1;
speech.onend = () => {
avatar.classList.remove("speaking");
setStatus("Tayyor");
};

speechSynthesis.speak(speech);
}

function setStatus(text) {
document.getElementById("avatarStatus").innerText = text;
}

function toggleListening() {
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition) {
alert("Ovozli boshqaruv uchun Google Chrome’dan foydalaning.");
return;
}

if(listening) {
recognition.stop();
return;
}

recognition = new SpeechRecognition();
recognition.lang = "uz-UZ";
recognition.interimResults = false;

recognition.onstart = () => {
listening = true;
document.getElementById("avatar").classList.add("listening");
setStatus("Tinglayapti...");
};

recognition.onresult = event => {
handleVoiceCommand(event.results[0][0].transcript);
};

recognition.onend = () => {
listening = false;
document.getElementById("avatar").classList.remove("listening");
setStatus("Tayyor");
};

recognition.start();
}

function handleVoiceCommand(text) {
const lower = text.toLowerCase();

if(lower.includes("yangi chat")) {
document.getElementById("chat").innerHTML = "";
addMessage("Ulug'bek AI", "Yangi professional suhbat ochildi.");
return;
}

if(lower.includes("to‘xta") || lower.includes("toxta")) {
speechSynthesis.cancel();
setStatus("To‘xtatildi");
return;
}

sendMessage(text);
}

async function generateApp() {
const prompt = document.getElementById("appPrompt").value.trim();
const status = document.getElementById("buildStatus");

if(!prompt) {
alert("Iltimos, ilova g‘oyasini kiriting.");
return;
}

status.classList.remove("hidden");
status.innerText = "Professional mahsulot arxitekturasi tuzilmoqda...";

try {
const response = await fetch("/api/generate-app", {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({prompt})
});
const data = await response.json();

if(data.error) throw new Error(data.error);

document.getElementById("codeArea").classList.remove("hidden");
document.getElementById("generatedCode").value = data.code;
document.getElementById("downloadLink").href = URL.createObjectURL(new Blob([data.code], {type:"text/html"}));
status.innerText = "✅ Professional ilova tayyor!";
speak("Professional ilova tayyor bo‘ldi.");
} catch(error) {
status.innerText = "❌ " + error.message;
}
}

loadConfig();
</script>
</body>
</html>
