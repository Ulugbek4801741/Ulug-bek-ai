<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ulug'bek AI — Ovozli AI Platforma</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { background:#050811; color:#f8fafc; font-family:system-ui,sans-serif; }
.glass { background:rgba(13,19,33,.85); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.08); }
.avatar { width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0b1120;border:4px solid #6366f1;animation:pulse 2s infinite alternate; }
@keyframes pulse { from { box-shadow:0 0 15px rgba(99,102,241,.4); transform:scale(1); } to { box-shadow:0 0 40px rgba(16,185,129,.8); transform:scale(1.06); } }
.speaking { border-color:#10b981; animation:talk .35s infinite alternate; }
@keyframes talk { from { transform:scale(1); } to { transform:scale(1.08); } }
.listening { border-color:#f59e0b; }
.scroll::-webkit-scrollbar { width:5px; }
.scroll::-webkit-scrollbar-thumb { background:#10b981; border-radius:10px; }
</style>
</head>
<body class="min-h-screen p-4 pb-24">

<div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
<div class="glass max-w-sm w-full rounded-3xl p-7 text-center">
<h1 class="text-3xl font-black bg-gradient-to-r from-emerald-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">Ulug'bek AI</h1>
<p class="text-sm text-slate-400 mt-2">Google akkauntingiz bilan kiring va ovozli AI yordamchidan foydalaning.</p>
<div id="googleButton" class="mt-6 flex justify-center"></div>
</div>
</div>

<header class="glass max-w-6xl mx-auto rounded-3xl p-5 mb-5 flex items-center justify-between">
<div>
<h1 class="text-xl md:text-3xl font-black bg-gradient-to-r from-emerald-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">Ulug'bek AI</h1>
<p class="text-xs text-slate-400">Ovozli AI yordamchi va No-Code ilova generatori</p>
</div>
<div id="profile" class="hidden flex items-center gap-3">
<img id="userPhoto" class="w-10 h-10 rounded-full border border-indigo-500" alt="">
<span id="userName" class="text-sm font-bold"></span>
</div>
</header>

<main class="max-w-6xl mx-auto grid lg:grid-cols-2 gap-5">

<section class="glass rounded-3xl p-5">
<h2 class="font-black mb-4"><i class="fa-solid fa-robot text-emerald-400 mr-2"></i>Ovozli AI Suhbat</h2>
<div class="flex flex-col items-center">
<div id="avatar" class="avatar"><i id="avatarIcon" class="fa-solid fa-brain text-4xl text-emerald-400"></i></div>
<p id="avatarStatus" class="text-xs text-slate-300 mt-3 font-bold">Tayyor</p>
</div>
<div id="chat" class="h-64 overflow-y-auto mt-4 p-3 bg-slate-950 rounded-2xl border border-slate-800 text-sm space-y-3 scroll"></div>
<div class="flex gap-2 mt-4">
<input id="message" placeholder="Savol yozing yoki mikrofonni bosing..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm">
<button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 px-4 rounded-xl"><i class="fa-solid fa-paper-plane"></i></button>
<button id="micButton" onclick="toggleListening()" class="bg-emerald-600 hover:bg-emerald-500 px-4 rounded-xl"><i class="fa-solid fa-microphone"></i></button>
</div>
</section>

<section class="glass rounded-3xl p-5">
<h2 class="font-black mb-4"><i class="fa-solid fa-wand-magic-sparkles text-indigo-400 mr-2"></i>No-Code Ilova Yaratish</h2>
<textarea id="appPrompt" rows="6" placeholder="Masalan: Valyuta kursini hisoblovchi chiroyli mobil ilova yoz..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm"></textarea>
<button onclick="generateApp()" class="w-full mt-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-emerald-600 py-4 rounded-2xl font-black">🚀 Ilovani yaratish</button>
<div id="buildStatus" class="hidden mt-4 text-sm text-emerald-400 font-bold"></div>
<div id="codeArea" class="hidden mt-4">
<textarea id="generatedCode" rows="8" class="w-full bg-black text-emerald-400 text-xs p-3 rounded-xl border border-slate-800"></textarea>
<a id="downloadLink" class="block text-center mt-3 bg-emerald-600 py-3 rounded-xl font-bold" download="Ulugbek_AI_App.html">📲 HTML ilovani yuklab olish</a>
</div>
</section>

</main>

<script>
let googleClientId = "";
let listening = false;
let recognition;

async function loadConfig() {
const response = await fetch("/api/config");
const data = await response.json();
googleClientId = data.googleClientId;

if(!googleClientId) {
document.getElementById("googleButton").innerHTML = "<p class='text-red-400 text-sm'>GOOGLE_CLIENT_ID sozlanmagan.</p>";
return;
}

google.accounts.id.initialize({
client_id: googleClientId,
callback: handleGoogleResponse
});

google.accounts.id.renderButton(document.getElementById("googleButton"), {
theme: "filled_black",
size: "large",
shape: "pill",
text: "signin_with",
locale: "uz"
});
}

function handleGoogleResponse(response) {
const payload = JSON.parse(atob(response.credential.split(".")[1]));

document.getElementById("loginScreen").classList.add("hidden");
document.getElementById("profile").classList.remove("hidden");
document.getElementById("userPhoto").src = payload.picture;
document.getElementById("userName").innerText = payload.name;

addMessage("Ulug'bek AI", `Xush kelibsiz, ${payload.name}! Menga ovoz bilan yozing yoki savolingizni yozing.`);
speak(`Xush kelibsiz, ${payload.name}`);
}

function addMessage(sender, text) {
const chat = document.getElementById("chat");
const div = document.createElement("div");
div.className = sender === "Siz" ? "bg-slate-900 p-3 rounded-xl text-right" : "bg-indigo-950/50 border border-indigo-500/30 p-3 rounded-xl";
div.innerHTML = `<b>${sender}:</b> ${text}`;
chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(text) {
const input = document.getElementById("message");
const message = text || input.value.trim();
if(!message) return;

addMessage("Siz", message);
input.value = "";
setStatus("O‘ylayapti...");

try {
const response = await fetch("/api/chat", {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({prompt: message})
});
const data = await response.json();

if(data.error) throw new Error(data.error);

addMessage("Ulug'bek AI", data.reply);
speak(data.reply);
} catch(error) {
addMessage("Xatolik", error.message);
speak("Kechirasiz, xatolik yuz berdi.");
}

setStatus("Tayyor");
}

function speak(text) {
const avatar = document.getElementById("avatar");
avatar.classList.add("speaking");
setStatus("Gapiryapti...");

const speech = new SpeechSynthesisUtterance(text);
speech.lang = "uz-UZ";
speech.onend = () => {
avatar.classList.remove("speaking");
setStatus("Tayyor");
};

speechSynthesis.speak(speech);
}

function setStatus(text) {
document.getElementById("avatarStatus").innerText = text;
}

function toggleListening() {
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition) {
alert("Brauzeringiz ovozni tanishni qo‘llab-quvvatlamaydi. Google Chrome’dan foydalaning.");
return;
}

if(listening) {
recognition.stop();
return;
}

recognition = new SpeechRecognition();
recognition.lang = "uz-UZ";
recognition.interimResults = false;

recognition.onstart = () => {
listening = true;
document.getElementById("avatar").classList.add("listening");
setStatus("Tinglayapti...");
};

recognition.onresult = event => {
const text = event.results[0][0].transcript;
handleVoiceCommand(text);
};

recognition.onend = () => {
listening = false;
document.getElementById("avatar").classList.remove("listening");
setStatus("Tayyor");
};

recognition.start();
}

function handleVoiceCommand(text) {
const lower = text.toLowerCase();

if(lower.includes("yangi chat")) {
document.getElementById("chat").innerHTML = "";
addMessage("Ulug'bek AI", "Yangi suhbat ochildi.");
return;
}

if(lower.includes("to‘xta") || lower.includes("toxta")) {
speechSynthesis.cancel();
setStatus("To‘xtatildi");
return;
}

sendMessage(text);
}

async function generateApp() {
const prompt = document.getElementById("appPrompt").value.trim();
const status = document.getElementById("buildStatus");

if(!prompt) {
alert("Iltimos, ilova g‘oyasini kiriting.");
return;
}

status.classList.remove("hidden");
status.innerText = "AI ilovani yaratmoqda...";

try {
const response = await fetch("/api/generate-app", {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify({prompt})
});
const data = await response.json();

if(data.error) throw new Error(data.error);

document.getElementById("codeArea").classList.remove("hidden");
document.getElementById("generatedCode").value = data.code;
document.getElementById("downloadLink").href = URL.createObjectURL(new Blob([data.code], {type:"text/html"}));
status.innerText = "✅ Ilova tayyor!";
speak("Ilova tayyor bo‘ldi.");
} catch(error) {
status.innerText = "❌ " + error.message;
}
}

loadConfig();
</script>
</body>
</html>
