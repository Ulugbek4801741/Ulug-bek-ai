<!doctype html>
<html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ulug‘bek AI</title>
<style>body{margin:0;background:#080e20;color:#eef2ff;font:16px system-ui}main{max-width:800px;margin:auto;padding:24px}section{background:#151e35;border:1px solid #334155;border-radius:20px;padding:24px;margin:20px 0}button,input,textarea{font:inherit;padding:12px;border-radius:10px;box-sizing:border-box}button{cursor:pointer;background:#a5b4fc;color:#111827;border:0;margin:6px}input,textarea{width:100%;background:#080e20;color:white;border:1px solid #64748b}#status{white-space:pre-wrap;color:#fcd34d}#chat{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#a5b4fc}</style>
<main><h1>Ulug‘bek AI</h1><section><h2>Google bilan kirish</h2><p id="status" role="status">Server tekshirilmoqda…</p><div id="googleButton"></div><button id="retry">Qayta tekshirish</button><p id="profile"></p></section><section><h2>AI suhbat</h2><div id="chat" aria-live="polite"></div><form id="form"><input id="message" maxlength="8000" required placeholder="Savolingiz"><button id="send">Yuborish</button></form><button id="mic">Mikrofon</button><button id="stop">Ovozni to‘xtatish</button><label><input id="voice" type="checkbox" style="width:auto"> Javobni ovozli o‘qish</label></section><section><h2>HTML ilova yaratish</h2><textarea id="idea" rows="4" maxlength="8000" placeholder="Ilova g‘oyasi"></textarea><button id="build">Yaratish</button><p id="buildStatus"></p><textarea id="code" rows="8" readonly hidden></textarea><a id="download" download="ulugbek-app.html" hidden>HTML faylni yuklab olish</a></section></main>
<script>
const el=id=>document.getElementById(id);let busy=false,blobUrl;
async function api(path,body){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),75000);try{const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body),credentials:'same-origin',signal:controller.signal});if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('Server JSON javob bermadi. GitHub Pages Python backendni ishlatmaydi. Saytni Flask server orqali oching.');const data=await r.json();if(!r.ok||data.error)throw Error(data.error||'Server xatosi: '+r.status);return data;}catch(e){if(e.name==='AbortError')throw Error('Server javobini kutish muddati tugadi.');throw e;}finally{clearTimeout(timer);}}
function googleScript(){if(window.google?.accounts?.id)return Promise.resolve();return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;const t=setTimeout(()=>{s.remove();reject(Error('Google skripti yuklanmadi. Internet yoki bloklovchi kengaytmalarni tekshiring.'));},15000);s.onload=()=>{clearTimeout(t);resolve();};s.onerror=()=>{clearTimeout(t);s.remove();reject(Error('Google xizmatiga ulanish amalga oshmadi.'));};document.head.append(s);});}
async function init(){el('retry').disabled=true;el('status').textContent='Server tekshirilmoqda…';try{const cfg=await api('/api/config');if(!cfg.googleClientId)throw Error('Serverda GOOGLE_CLIENT_ID sozlanmagan. Administrator Google OAuth Client ID kiritishi kerak.');await googleScript();google.accounts.id.initialize({client_id:cfg.googleClientId,callback:login});el('googleButton').replaceChildren();google.accounts.id.renderButton(el('googleButton'),{theme:'outline',size:'large',text:'signin_with'});el('status').textContent='Google akkauntingizni tanlang.';}catch(e){el('status').textContent=e.message;}finally{el('retry').disabled=false;}}
async function login(result){try{const data=await api('/api/login',{credential:result.credential});if(!data.user)throw Error('Server foydalanuvchi ma’lumotini qaytarmadi.');el('profile').textContent=data.user.name||data.user.email||'Foydalanuvchi';el('status').textContent='Kirish so‘rovi bajarildi.';}catch(e){el('status').textContent=e.message;}}
function add(who,text){const p=document.createElement('p');p.textContent=who+': '+text;el('chat').append(p);}
async function send(text){if(busy||!text.trim())return;busy=true;el('send').disabled=true;add('Siz',text);try{const d=await api('/api/chat',{prompt:text});add('AI',d.reply);if(el('voice').checked&&'speechSynthesis'in window){const u=new SpeechSynthesisUtterance(d.reply);u.lang='uz-UZ';speechSynthesis.speak(u);}}catch(e){add('Xatolik',e.message);}finally{busy=false;el('send').disabled=false;}}
el('form').onsubmit=e=>{e.preventDefault();const text=el('message').value;el('message').value='';send(text);};el('retry').onclick=init;el('stop').onclick=()=>window.speechSynthesis?.cancel();
el('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('Xabar','Bu brauzer ovozni tanishni qo‘llamaydi. Matn yozing.');return;}const r=new R();r.lang='uz-UZ';r.onresult=e=>send(e.results[0][0].transcript);r.onerror=e=>add('Mikrofon',e.error);try{r.start();}catch(e){add('Xatolik',e.message);}};
el('build').onclick=async()=>{const text=el('idea').value.trim();if(!text)return;el('build').disabled=true;el('download').hidden=true;el('buildStatus').textContent='Yaratilmoqda…';try{const d=await api('/api/generate-app',{prompt:text});if(typeof d.code!=='string'||!d.code.trim())throw Error('Bo‘sh kod qaytdi.');el('code').hidden=false;el('code').value=d.code;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob([d.code],{type:'text/html'}));el('download').href=blobUrl;el('download').hidden=false;el('buildStatus').textContent='Kod olindi. Bu kod avtomatik xavfsizlik va funksional sinovdan o‘tmagan.';}catch(e){el('buildStatus').textContent=e.message;}finally{el('build').disabled=false;}};init();
</script></html>
